name: CoachLOL dev69 — P1 targetable clones, isolated specialist QA
on:
  push:
    branches:
      - fix/skills-entity-targetability-p1-dev69
      - dev69/skills-batch2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skills-entity-targetability:
    name: P1 clone selection, QWER regressions, PvP and snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax validation
        run: |
          node --check engine.mjs
          node --check multiplayer/authoritative_actions_v453_dev44.mjs
          node --check tests/audit/v453_clone_targetability_audit.test.mjs
          node --check tests/audit/v453_global_contract_execution_audit.test.mjs
          node --check tests/audit/v453_entity_shape_matrix.test.mjs
          node --check tests/audit/v453_entity_projectile_trap_m17.test.mjs
          node --check tests/audit/v453_entity_projectile_matrix_m17.test.mjs
          node --check tests/audit/v453_m18_all_decoys_identity_target_matrix.test.mjs
      - name: New strict clone targetability contracts (previously 10 failures)
        run: node tests/audit/v453_clone_targetability_audit.test.mjs --strict
      - name: All 173 champion rule routes and M9-M16 authored slots
        run: node tests/audit/v453_global_contract_execution_audit.test.mjs
      - name: Data-driven damage geometry matrix and PvP receipt idempotency
        run: node tests/audit/v453_entity_shape_matrix.test.mjs
      - name: M17 delayed projectiles, Jhin R and trap contact with decoys
        run: node tests/audit/v453_entity_projectile_trap_m17.test.mjs
      - name: M17 seven real travelling missile families x two PvP teams
        run: node tests/audit/v453_entity_projectile_matrix_m17.test.mjs
      - name: M18 four clone families, disguise, aliases, targeted, projectile and Jhin R
        run: node tests/audit/v453_m18_all_decoys_identity_target_matrix.test.mjs
      - name: M20 B01 35 champion x QWER x two human PvP seats
        run: |
          node --check engine.mjs
          node --check tests/audit/v453_m20_b01_pvp_matrix.test.mjs
          node tests/audit/v453_m20_b01_pvp_matrix.test.mjs
          node --check tests/audit/v453_m20_b01_special_primitives.test.mjs
          node tests/audit/v453_m20_b01_special_primitives.test.mjs
          node --check tests/audit/v453_m21_b01_stateful_primitives.test.mjs
          node tests/audit/v453_m21_b01_stateful_primitives.test.mjs
          node --check tests/audit/v453_m21_b01_passive_events.test.mjs
          node tests/audit/v453_m21_b01_passive_events.test.mjs
          node --check tests/audit/v453_m21_b01_dual_target_support.test.mjs
          node tests/audit/v453_m21_b01_dual_target_support.test.mjs
          node --check tests/audit/v453_m22_b01_channel_fuse.test.mjs
          node tests/audit/v453_m22_b01_channel_fuse.test.mjs
      - name: M19 full 173 champion macro-batch QA gates
        run: |
          node --check tools/skills_macro_batch_planner_v453_dev69.mjs
          node --check tests/audit/v453_m19_macro_batch_gate.test.mjs
          node tests/audit/v453_m19_macro_batch_gate.test.mjs
          node tools/skills_macro_batch_planner_v453_dev69.mjs --out docs/skills_macro_batches_dev69
      - name: Export five macro-batch contracts for Skills engineering
        uses: actions/upload-artifact@v4
        with:
          name: coachlol-skills-m19-173-pqwer-macro-batches
          path: docs/skills_macro_batches_dev69/
          retention-days: 30
      - name: Existing M15 clone/sylas checkpoints
        run: node tests/v453_dev69_clones_m15.test.mjs
      - name: Existing M16 stealth/traps/abilities
        run: node tests/v453_dev69_mechanics_m16.test.mjs
      - name: Board grammar, mechanics and M14 forms
        run: |
          node tests/v453_dev69_board_grammar.test.mjs
          node tests/v453_dev69_forms_m14.test.mjs
          node tests/v453_dev69_sylas_m14.test.mjs
      - name: Existing V42 and PvP regressions
        run: |
          node tests/v42_champion_kits.test.mjs
          node tests/v453_dev69_skills_batch2.test.mjs
          node tests/v453_dev68_lux_projectile_pvp.test.mjs
