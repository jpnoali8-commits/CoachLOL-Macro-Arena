<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoachLOL · Catálogo de referência 26.21</title>
<style>
:root{color-scheme:dark;--bg:#0d0f13;--panel:#16191d;--panel2:#1c2025;--border:#373328;--gold:#d8b876;--soft:#9b9ba1;--txt:#f0eadd;--green:#78caab;--warn:#dfaf75}*{box-sizing:border-box}body{background:var(--bg);color:var(--txt);margin:0;font:14px/1.48 system-ui,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:3;padding:14px max(20px,calc((100vw - 1300px)/2));background:#101216f7;border-bottom:1px solid var(--border)}h1{font-size:19px;font-weight:650;margin:0;color:var(--gold)}header p{margin:4px 0 0;color:var(--soft)}main{display:grid;grid-template-columns:minmax(380px,1.2fr) minmax(300px,.8fr);max-width:1300px;margin:0 auto;padding:18px;gap:14px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:15px}.metrics{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 13px}.metric{background:#23241f;padding:7px 11px;border-radius:7px;border:1px solid #3a3324}.metric b{color:var(--gold)}.controls{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}input,select,button{font:inherit}input,select{background:#0c0e11;color:var(--txt);border:1px solid #4d4434;border-radius:6px;padding:9px}input{flex:1;min-width:180px}select{max-width:220px}.itemList{height:calc(100vh - 295px);min-height:320px;overflow:auto;display:grid;align-content:start;gap:4px}.item{width:100%;display:flex;align-items:center;gap:9px;text-align:left;border:1px solid transparent;background:var(--panel2);border-radius:6px;color:var(--txt);padding:7px;cursor:pointer}.item:hover,.item.active{border-color:var(--gold)}.item-icon{height:35px;width:35px;border-radius:5px;background:#303038;object-fit:cover}.itemtext{min-width:0;flex:1}.itemtext strong,.itemtext small{display:block}.itemtext small,.muted{color:var(--soft)}.cost{color:var(--gold);font-weight:600}.status{font-size:11px;border:1px solid #5d5235;border-radius:20px;padding:2px 7px;color:#cdbd91;white-space:nowrap}.status.game{color:var(--green);border-color:#3c655b}.status.special{color:var(--warn);border-color:#6c503b}aside{min-height:400px;max-height:calc(100vh - 120px);overflow:auto}h2{font-size:20px;margin:9px 0 6px}h3{font-size:14px;color:var(--gold);margin:17px 0 7px}p{margin:6px 0}.eyebrow{color:var(--gold);letter-spacing:.08em;font-size:11px;text-transform:uppercase}.stats{display:flex;gap:6px;flex-wrap:wrap}.stat{background:#242620;padding:5px 8px;border-radius:4px;color:#dfd8c5}.recipe{display:flex;flex-direction:column;gap:7px}.recipe button{border:1px solid #615038;border-radius:5px;background:#24231e;color:var(--txt);text-align:left;padding:8px;cursor:pointer}.recipe button:hover{border-color:var(--gold)}.foot{border-top:1px solid var(--border);padding-top:12px;margin-top:20px;color:var(--soft);font-size:12px}a{color:var(--gold)}.empty{color:var(--soft);padding:20px}.notice{background:#2c271d;border-left:3px solid var(--gold);border-radius:3px;padding:11px;margin:9px 0;color:#eddbaf}@media(max-width:800px){main{grid-template-columns:1fr}aside{max-height:none}.itemList{height:390px}}
</style></head><body>
<header><h1>CoachLOL · Catálogo de referência — LoL 26.21</h1><p>Riot Data Dragon 16.21.1 · português/inglês · CommunityDragon complementar · <b>somente consulta, não altera a partida</b></p></header>
<main><section class="panel"><div id="metrics" class="metrics"></div><div class="controls"><input id="q" type="search" placeholder="Buscar nome, ID ou atributo…" aria-label="Pesquisar itens"><select id="category" aria-label="Categoria"><option value="all">Todas as categorias</option><option value="shop_reference">Loja (candidatos)</option><option value="conditional_evolution">Evoluções condicionais</option><option value="champion_exclusive">Exclusivos de campeão</option><option value="minion_turret_internal">Internos de unidades</option><option value="non_purchasable">Não compráveis</option><option value="non_summoners_rift">Outros modos</option></select><select id="local" aria-label="Cobertura local"><option value="all">Todas as coberturas</option><option value="implemented">Possui ID jogável</option><option value="missing">Sem ID jogável</option></select></div><div id="matchCount" class="muted" aria-live="polite"></div><div id="items" class="itemList"></div></section><aside class="panel" id="detail" aria-live="polite"><div class="empty">Selecione um item para consultar preço, atributos e receita.</div></aside></main>
<script src="data/riot_reference/catalog_26_21_dev38.js"></script><script>
(()=>{'use strict';const data=window.COACHLOL_OFFICIAL_CATALOG;if(!data){document.getElementById('items').textContent='Catálogo não disponível. Abra este HTML junto à pasta data do jogo.';return}
const $=s=>document.querySelector(s),all=Object.values(data.items),byId=data.items,norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const labels={shop_reference:'Referência de loja',conditional_evolution:'Evolução de missão',champion_exclusive:'Exclusivo',minion_turret_internal:'Interno de unidade',non_purchasable:'Não comprável',non_summoners_rift:'Outro modo'};
function el(tag,txt,cl){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cl)e.className=cl;return e}
const icon=id=>{const im=el('img');im.className='item-icon';im.loading='lazy';im.alt='';im.src='https://ddragon.leagueoflegends.com/cdn/16.21.1/img/item/'+id+'.png';im.onerror=()=>{im.onerror=null;im.style.visibility='hidden'};return im};
function stat(d){const b=el('span',d,'stat');return b}
$('#metrics').append(...[['Registros',data.counts.all],['Summoner’s Rift',data.counts.rift],['Riot marca compráveis',data.counts.riotPurchasableRift],['Itens jogáveis locais',data.counts.localPlayableItems]].map(([name,n])=>{const x=el('div',undefined,'metric');x.append(el('span',name+' '),el('b',String(n)));return x}));
let current=null;
function inspect(id){const r=byId[id];if(!r)return;current=id;const pane=$('#detail');pane.replaceChildren();pane.append(el('div','ID '+r.id+' · '+labels[r.category],'eyebrow'),el('h2',r.namePt||r.name),el('p',r.name+' · '+r.cost+' ouro'));
 const flag=el('div',r.localPlayable?'Possui entrada local: '+r.localId+' (efeitos podem ser parciais)':'Somente referência — não pode ser comprado na loja jogável','notice');pane.append(flag);
 if(r.requiredChampion)pane.append(el('p','Campeão obrigatório: '+r.requiredChampion));
 if(r.category==='conditional_evolution')pane.append(el('p','Esta evolução depende de missão/estado anterior, não deve ser comprada livremente.'));
 if(r.category==='minion_turret_internal')pane.append(el('p','Registro interno: atributos e modificadores de estruturas dependem de regras próprias do motor.'));
 pane.append(el('h3','Atributos informados pelo Data Dragon'));const st=el('div',undefined,'stats');const stats=Object.entries(r.stats).filter(([,v])=>v!==0);
 if(stats.length)for(const [k,v] of stats)st.append(stat(k+': '+v));else st.append(el('span','Sem atributos numéricos diretos.','muted'));pane.append(st);
 pane.append(el('h3','Árvore oficial de componentes'));const recipe=el('div',undefined,'recipe');
 if(r.from.length)for(const sub of r.from){const component=byId[sub];if(!component)continue;const b=el('button',(component.namePt||component.name)+' · '+component.cost+' ouro · ID '+sub);b.onclick=()=>{inspect(sub);highlight()};recipe.append(b)}else recipe.append(el('div','Nenhum componente listado.','muted'));
 pane.append(recipe);if(r.into.length){pane.append(el('h3','Pode evoluir para'));const upgrades=el('div',undefined,'recipe');for(const id2 of r.into){const to=byId[id2];if(!to)continue;const b=el('button',(to.namePt||to.name)+' · '+to.cost+' ouro');b.onclick=()=>{inspect(id2);highlight()};upgrades.append(b)}pane.append(upgrades)}
 if(r.descriptionPt){pane.append(el('h3','Descrição estática fornecida'));pane.append(el('p',r.descriptionPt))}
 const note=el('div','Fonte: Riot Data Dragon 16.21.1. Campos de restrição complementados por CommunityDragon latest. Descrições não executam passivas ou ativos; o catálogo não modifica itens jogáveis.','foot');pane.append(note);
 highlight();}
 function highlight(){document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.id===current))}
 function render(){const q=norm($('#q').value),category=$('#category').value,local=$('#local').value;let results=all.filter(x=>(category==='all'||x.category===category)&&(local==='all'||(local==='implemented'?x.localPlayable:!x.localPlayable))&&(!q||norm(x.namePt+' '+x.name+' '+x.id+' '+x.tags.join(' ')).includes(q)));
 $('#matchCount').textContent=results.length+' de '+all.length+' registros';const list=$('#items');list.replaceChildren();for(const r of results){const b=el('button',undefined,'item');b.type='button';b.dataset.id=r.id;b.append(icon(r.id));const info=el('span',undefined,'itemtext');info.append(el('strong',r.namePt||r.name),el('small','#'+r.id+' · '+labels[r.category]));b.append(info);b.append(el('span',String(r.cost)+'g','cost'));b.append(el('span',r.localPlayable?'Local':'Ref.','status '+(r.localPlayable?'game':'special')));b.onclick=()=>inspect(r.id);list.append(b)}highlight()}
 for(const sel of ['#q','#category','#local'])$(sel).addEventListener(sel==='#q'?'input':'change',render);render();})();
</script></body></html>
